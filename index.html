<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth or Dare</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700,900|Pacifico|Quicksand:600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Quicksand', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #fcb7c4 0%, #f7f0ac 55%, #a8edea 100%);
      min-height: 100vh;
      margin: 0;
      color: #46394D;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        radial-gradient(circle at 15% 20%, #ffb7db88 0%, transparent 70%),
        radial-gradient(circle at 85% 80%, #fad0c49c 0%, transparent 60%),
        radial-gradient(circle at 60% 100%, #ffdff6aa 0%, transparent 70%),
        repeating-linear-gradient(135deg, #ffdde1 0 16px, #fcb7c4 16px 32px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.8;
      animation: bgMove 16s linear infinite alternate;
    }
    @keyframes bgMove {
      0% { transform: scale(1) translateY(0);}
      100% {transform: scale(1.09) translateY(-24px);}
    }
    .container {
      background: rgba(255,255,255,0.92);
      border-radius: 22px;
      box-shadow: 0 4px 32px 0 #ffcde3, 0 1.5px 7px #ffd2a6;
      padding: 48px 30px 36px 30px;
      text-align: center;
      width: 92%;
      max-width: 400px;
      border: 2.5px solid #FEB7B7;
      position: relative;
      z-index: 1;
      animation: popIn 1.1s cubic-bezier(.68,-0.55,.27,1.55);
    }
    @keyframes popIn {
      0% {transform: scale(0.75) rotate(-6deg); opacity: 0;}
      60% {transform: scale(1.06) rotate(3deg); opacity: 1;}
      100% {transform: scale(1) rotate(0);}
    }
    h1 {
      font-size: 2.35rem;
      color: #ee5684;
      font-family: 'Pacifico', 'Montserrat', 'Segoe UI', Arial, sans-serif;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: 2px;
      text-shadow: 0 2px 12px #ffd1eec0, 0 1px 0 #fff2;
      animation: bounceTitle 2.2s infinite alternate;
      line-height: 1.05;
    }
    @keyframes bounceTitle {
      0% { transform: translateY(0);}
      55% { transform: translateY(-12px) scale(1.06);}
      100% {transform: translateY(0);}
    }
    .lovely-signature {
      font-family: 'Pacifico', cursive;
      font-size: 1.35rem;
      color: #ff85c2;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px #ffd8ef99;
      background: rgba(252,183,196,0.13);
      border-radius: 10px;
      padding: 3px 16px 3px 12px;
      border: 1.8px solid #FFD6E0;
      box-shadow: 0 1.5px 8px #ffb7db44;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      animation: popIn 1.3s 0.4s both;
    }
    .lovely-signature span.heart {
      font-size: 1.15em;
      color: #fd709e;
      margin-left: 2px;
      margin-right: -2px;
      animation: pulseHeart 0.9s infinite alternate;
    }
    @keyframes pulseHeart {
      0% {transform: scale(1);}
      100% {transform: scale(1.2);}
    }
    input[type="text"] {
      padding: 13px 16px;
      font-size: 1.13rem;
      border: 2.5px solid #ffb7db;
      border-radius: 12px;
      background: #fff0f6;
      color: #ec4e6d;
      width: 100%;
      margin-bottom: 23px;
      text-align: center;
      outline: none;
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      box-shadow: 0 1.5px 8px #ffd1ea55;
      transition: border-color 0.22s, box-shadow 0.22s;
    }
    input[type="text"]:focus {
      border-color: #ec4e6d;
      background: #fff7fc;
      box-shadow: 0 2.5px 16px #ffe5f3aa;
    }
    button {
      padding: 15px 38px;
      font-size: 1.17rem;
      background: linear-gradient(90deg, #ffb7db 0%, #ffe29b 100%);
      border: none;
      border-radius: 16px;
      color: #ff4b91;
      font-weight: 900;
      box-shadow: 0 2.5px 15px #ffb7db44;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: 1px;
      transition: background 0.22s, box-shadow 0.19s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    button::after {
      content: '';
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      background: linear-gradient(120deg, #fff4 0%, #fff0 100%);
      opacity: 0.15;
      pointer-events: none;
    }
    button:hover {
      background: linear-gradient(90deg, #ffe29b 0%, #ffb7db 100%);
      transform: scale(1.08) rotate(-2deg);
      box-shadow: 0 4px 32px #fac6d1a0;
    }
    /* Result section */
    #truth-or-dare {
      margin-top: 32px;
    }
    #result {
      font-size: 1.21rem;
      background: linear-gradient(120deg, #fff0f4 0%, #ffeadd 100%);
      color: #fa67a5;
      padding: 25px 16px;
      border-radius: 16px;
      border: 2.7px solid #ffb7db;
      box-shadow: 0 2.7px 14px #ffd1ea88;
      font-family: 'Quicksand', 'Montserrat', sans-serif;
      margin-top: 8px;
      min-height: 45px;
      transition: background 0.22s, color 0.19s;
      animation: resultPop 0.8s cubic-bezier(.68,-0.55,.27,1.55);
      letter-spacing: 0.5px;
    }
    @keyframes resultPop {
      0% { transform: scale(0.8) rotate(-2deg); opacity: 0;}
      60% { transform: scale(1.07) rotate(1.5deg); opacity: 1;}
      100% { transform: scale(1) rotate(0);}
    }
    footer {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 1.08rem;
      color: #fa7cab;
      font-family: 'Quicksand', cursive;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-shadow: 0 1px 10px #ffc5d055;
      z-index: 2;
      background: none;
      opacity: 0.99;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <h1>Truth or Dare</h1>
    <input type="text" id="user-name" placeholder="Type your name... I pinky promise I won't fall for you 🩷" autocomplete="off" />
    <button onclick="startGame()">Let's Play</button>
    <!-- Result Container -->
    <div id="truth-or-dare">
      <h2 id="result"></h2>
    </div>
  </div>
  <!-- Footer -->
  <footer>
    <p>Made with <span style="color:#ff4b91;">♥</span> by Anu 🌸</p>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
